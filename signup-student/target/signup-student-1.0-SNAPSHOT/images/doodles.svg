<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .s{fill:none;stroke:rgba(2,26,58,0.20);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- scattered small doodles inside tile to create randomized appearance when repeated -->
  <!-- multiple small graduation caps -->
  <g transform="translate(30,30) scale(0.35) rotate(-10)">
    <path class="s" d="M50 20 L150 60 L50 100 L-50 60 Z" />
    <path class="s" d="M50 100 L50 140" />
  </g>
  <g transform="translate(200,50) scale(0.3) rotate(15)">
    <path class="s" d="M50 20 L150 60 L50 100 L-50 60 Z" />
  </g>
  <g transform="translate(320,260) scale(0.28) rotate(5)">
    <path class="s" d="M50 20 L150 60 L50 100 L-50 60 Z" />
  </g>

  <!-- pens & pencils -->
  <g transform="translate(120,10) scale(0.25) rotate(-20)">
    <path class="s" d="M0 10 L80 50 L70 60 L-10 20 Z" />
  </g>
  <g transform="translate(260,10) scale(0.22) rotate(30)">
    <path class="s" d="M0 10 L80 50 L70 60 L-10 20 Z" />
  </g>
  <g transform="translate(40,260) scale(0.2) rotate(-40)">
    <path class="s" d="M0 10 L80 50 L70 60 L-10 20 Z" />
  </g>

  <!-- laptops -->
  <g transform="translate(10,180) scale(0.28) rotate(5)">
    <rect class="s" x="0" y="0" width="120" height="70" rx="6" ry="6" />
  </g>
  <g transform="translate(200,180) scale(0.22) rotate(-8)">
    <rect class="s" x="0" y="0" width="120" height="70" rx="6" ry="6" />
  </g>

  <!-- books -->
  <g transform="translate(140,100) scale(0.25) rotate(12)">
    <path class="s" d="M0 0 H60 A10 10 0 0 1 70 10 V70 A10 10 0 0 1 60 80 H0 Z" />
  </g>
  <g transform="translate(320,80) scale(0.18) rotate(-20)">
    <path class="s" d="M0 0 H60 A10 10 0 0 1 70 10 V70 A10 10 0 0 1 60 80 H0 Z" />
  </g>

  <!-- group/friends -->
  <g transform="translate(80,320) scale(0.22)">
    <circle class="s" cx="0" cy="0" r="12" />
    <circle class="s" cx="28" cy="-4" r="10" />
    <circle class="s" cx="-28" cy="-4" r="10" />
  </g>

  <g transform="translate(270,320) scale(0.18)">
    <circle class="s" cx="0" cy="0" r="12" />
    <circle class="s" cx="22" cy="-4" r="9" />
  </g>

  <!-- code symbols -->
  <g transform="translate(350,40) scale(0.18) rotate(10)">
    <path class="s" d="M0 10 L10 20 L0 30" />
    <path class="s" d="M20 10 L10 20 L20 30" />
  </g>
  <g transform="translate(280,200) scale(0.14) rotate(-10)">
    <path class="s" d="M0 10 L10 20 L0 30" />
  </g>

  <!-- lightbulb -->
  <g transform="translate(190,320) scale(0.14) rotate(5)">
    <path class="s" d="M20 6 A14 14 0 1 1 19.9 6" />
    <path class="s" d="M20 20 v8" />
    <rect class="s" x="14" y="28" width="12" height="6" rx="2"/>
  </g>

  <!-- ruler -->
  <g transform="translate(10,70) scale(0.16) rotate(25)">
    <rect class="s" x="0" y="0" width="140" height="20" rx="3"/>
    <path class="s" d="M6 4 v12 M20 4 v12 M34 4 v12"/>
  </g>

</svg>
